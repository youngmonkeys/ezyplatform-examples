<!DOCTYPE html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:ezy="http://www.ezyplatform.com/thymeleaf/layout"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{ezytheme}">
<head>
    <link rel="stylesheet" type="text/css" ezy:vhref="/css/main.css" />
    <link rel="stylesheet" type="text/css" ezy:vhref="/css/pages/cart.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet" />
    <script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
        var STORAGE_KEY = "sweetBakeryTheme";
        var stored = null;
        try {
            stored = localStorage.getItem(STORAGE_KEY);
        } catch (e) {}
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = stored === "light" || stored === "dark" ? stored : (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
    })();
    /*]]>*/
    </script>
</head>
<body>
<div layout:fragment="content">
    <main class="bakery-page">
        <section class="cart-page" th:aria-label="#{cart_page_title}">
            <div class="section-inner">
                <p class="breadcrumb">
                    <a href="/sweet-home-bakery" th:text="#{nav_home}">Trang chủ</a> / <span th:text="#{cart_page_title}">Giỏ hàng</span>
                </p>
                <h1 th:text="#{cart_page_title}">Giỏ hàng</h1>

                <div id="cartEmpty" class="cart-empty" hidden="hidden">
                    <p th:text="#{cart_empty_message}">Giỏ hàng của bạn đang trống.</p>
                    <a href="/thuc-don" th:text="#{view_menu}">Xem thực đơn</a>
                </div>

                <div class="cart-layout" id="cartLayout">
                    <div class="cart-list" id="cartList"></div>

                    <aside class="cart-summary">
                        <h2 th:text="#{cart_summary_title}">Tóm tắt đơn hàng</h2>
                        <div class="cart-summary-row">
                            <span class="cart-summary-label" th:text="#{cart_summary_quantity_label}">Số lượng</span>
                            <span class="cart-summary-value" id="cartSummaryQuantity">0</span>
                        </div>
                        <div class="cart-summary-row cart-summary-total">
                            <span class="cart-summary-label" th:text="#{cart_summary_total_label}">Tổng tiền</span>
                            <span class="cart-summary-value" id="cartSummaryTotal">0đ</span>
                        </div>
                        <button type="button" class="btn btn-primary" id="cartCheckoutBtn" style="margin-top: 16px;" th:text="#{cart_checkout_button}">Tiến hành thanh toán</button>
                        <a class="cart-continue" href="/thuc-don" th:text="#{cart_continue_shopping}">Tiếp tục mua sắm</a>
                    </aside>
                </div>
            </div>
        </section>

        <th:block th:replace="~{fragments/footer :: footer}" />
    </main>
</div>
<th:block layout:fragment="post-scripts">
    <script ezy:vsrc="/js/main.js"></script>
    <script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
        var CHECKOUT_URL = "/thanh-toan";
        var CART_API = "/api/v1/shopping-cart";
        var CART_PRODUCT_API_PREFIX = "/api/v1/checkout/shopping-cart-products/";
        var CURRENCY_ID = 3;
        var DEFAULT_IMAGE = "/images/placeholder-product.jpg";

        var cartEmpty = document.getElementById("cartEmpty");
        var cartLayout = document.getElementById("cartLayout");
        var cartList = document.getElementById("cartList");
        var summaryQuantity = document.getElementById("cartSummaryQuantity");
        var summaryTotal = document.getElementById("cartSummaryTotal");
        var checkoutBtn = document.getElementById("cartCheckoutBtn");

        var isUpdating = false;

        function fetchCart() {
            return fetch(CART_API).then(function (response) {
                if (!response.ok) throw new Error("Failed to load shopping cart");
                return response.json();
            });
        }

        function setCartBusy(busy) {
            isUpdating = busy;
            var buttons = cartList.querySelectorAll("button");
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].disabled = busy;
            }
        }

        function renderCart(cart) {
            var products = cart.products || [];

            cartList.innerHTML = "";

            if (products.length === 0) {
                cartEmpty.hidden = false;
                cartLayout.hidden = true;
                summaryQuantity.textContent = "0";
                summaryTotal.textContent = "0đ";
                checkoutBtn.disabled = true;
                return;
            }

            cartEmpty.hidden = true;
            cartLayout.hidden = false;
            checkoutBtn.disabled = false;

            var totalQuantity = 0;

            products.forEach(function (item) {
                totalQuantity += item.amount;

                var row = document.createElement("article");
                row.className = "cart-item";

                var media = document.createElement("div");
                media.className = "cart-item-media";
                var img = document.createElement("img");
                img.src = mediaUrl(item.product && item.product.bannerImage) || DEFAULT_IMAGE;
                img.alt = item.product ? item.product.productName : "";
                media.appendChild(img);

                var info = document.createElement("div");
                info.className = "cart-item-info";

                var name = document.createElement("h3");
                name.className = "cart-item-name";
                name.textContent = item.product ? item.product.productName : "";
                info.appendChild(name);

                if (item.size) {
                    var size = document.createElement("span");
                    size.className = "cart-item-size";
                    size.textContent = "Kích thước: " + (item.size.sizeDisplayName || item.size.sizeName);
                    info.appendChild(size);
                }

                var price = document.createElement("span");
                price.className = "cart-item-price";
                price.textContent = item.formattedTotalAmountMoney;
                info.appendChild(price);

                var actions = document.createElement("div");
                actions.className = "cart-item-actions";

                var stepper = document.createElement("div");
                stepper.className = "quantity-stepper";

                var minusBtn = document.createElement("button");
                minusBtn.type = "button";
                minusBtn.setAttribute("aria-label", "Giảm số lượng");
                minusBtn.textContent = "−";
                minusBtn.addEventListener("click", function () {
                    if (item.amount <= 1) return;
                    updateQuantity(item, item.amount - 1);
                });

                var qtyInput = document.createElement("input");
                qtyInput.type = "text";
                qtyInput.readOnly = true;
                qtyInput.setAttribute("aria-label", "Số lượng");
                qtyInput.value = String(item.amount);

                var plusBtn = document.createElement("button");
                plusBtn.type = "button";
                plusBtn.setAttribute("aria-label", "Tăng số lượng");
                plusBtn.textContent = "+";
                plusBtn.addEventListener("click", function () {
                    updateQuantity(item, item.amount + 1);
                });

                stepper.appendChild(minusBtn);
                stepper.appendChild(qtyInput);
                stepper.appendChild(plusBtn);

                var removeBtn = document.createElement("button");
                removeBtn.type = "button";
                removeBtn.className = "cart-item-remove";
                removeBtn.textContent = "Xóa";
                removeBtn.addEventListener("click", function () {
                    removeItem(item);
                });

                actions.appendChild(stepper);
                actions.appendChild(removeBtn);

                row.appendChild(media);
                row.appendChild(info);
                row.appendChild(actions);
                cartList.appendChild(row);
            });

            summaryQuantity.textContent = String(totalQuantity);
            summaryTotal.textContent = cart.formattedTotalAmountMoney;
        }

        function loadCart() {
            return fetchCart().then(function (cart) {
                renderCart(cart);
            }).catch(function (error) {
                console.error("Không thể tải giỏ hàng", error);
            });
        }

        function updateQuantity(item, quantity) {
            if (isUpdating) return;
            setCartBusy(true);

            var url = CART_PRODUCT_API_PREFIX + encodeURIComponent(item.id) + "?currencyId=" + CURRENCY_ID;
            var body = { quantity: quantity };
            if (item.color) body.productColorId = item.color.id;
            if (item.material) body.productMaterialId = item.material.id;
            if (item.size) body.productSizeId = item.size.id;

            fetch(url, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            }).then(function (response) {
                if (!response.ok) throw new Error("Failed to update quantity");
                return loadCart();
            }).then(function () {
                return updateCartCountBadge();
            }).catch(function (error) {
                console.error("Không thể cập nhật số lượng", error);
            }).then(function () {
                setCartBusy(false);
            });
        }

        function removeItem(item) {
            if (isUpdating) return;
            setCartBusy(true);

            var url = CART_PRODUCT_API_PREFIX + encodeURIComponent(item.id);
            fetch(url, { method: "DELETE" }).then(function (response) {
                if (!response.ok && response.status !== 204) throw new Error("Failed to remove item");
                return loadCart();
            }).then(function () {
                return updateCartCountBadge();
            }).catch(function (error) {
                console.error("Không thể xóa sản phẩm", error);
            }).then(function () {
                setCartBusy(false);
            });
        }

        checkoutBtn.addEventListener("click", function () {
            window.location.href = CHECKOUT_URL;
        });

        loadCart();
    })();
    /*]]>*/
    </script>
</th:block>
</body>
</html>
